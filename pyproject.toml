[project]
name = "anki-series"
version = "0.1.0"
description = "Genera mazos de Anki (.apkg) con el vocabulario más usado en los subtítulos de una serie."
readme = "README.md"
authors = [
    { name = "Javier Lozano", email = "fj.lozano.11@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "charset-normalizer>=3.5.3",
    "edge-tts>=7.3.1",
    "en-core-web-sm",
    "genanki>=0.13.1",
    "httpx>=0.28.1",
    "openai>=3.58.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.4",
    "spacy>=3.8.18",
    "typer>=0.29.2",
    "wordfreq>=3.1.1",
    "zstandard>=0.25.0",
]

[project.scripts]
anki-series = "anki_series.cli:app"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: errores básicos (pycodestyle/pyflakes), I: orden de imports,
# UP: sintaxis moderna de Python, B: bugs comunes (flake8-bugbear)
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
