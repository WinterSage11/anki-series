name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Installs Python (.python-version), dependencies and the spaCy model
      # en_core_web_sm (pinned wheel in pyproject.toml), exactly as in uv.lock.
      - name: Install dependencies
        run: uv sync --locked

      - name: Tests
        run: uv run pytest

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .
